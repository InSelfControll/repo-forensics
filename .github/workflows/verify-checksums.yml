name: Verify Checksums

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify checksums
        run: |
          cd skills/repo-forensics
          python3 scripts/verify_install.py --verify || {
            echo "::error::Checksums are stale. Run \`python verify_install.py --generate\` locally and commit the result."
            exit 1
          }

      # --verify confirms files match the manifest; this confirms the manifest
      # itself is signed by the pinned release key, so a regenerated manifest
      # that was not re-signed fails here instead of shipping.
      - name: Verify manifest signature
        run: |
          cd skills/repo-forensics
          python3 scripts/verify_install.py --verify-signature || {
            echo "::error::checksums.json is not signed by the pinned release key. Re-sign it with \`python3 scripts/sign_release_manifest.py\` and commit checksums.json.sig."
            exit 1
          }
